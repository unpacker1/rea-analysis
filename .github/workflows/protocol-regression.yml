name: Synthetic Alfa2 and Cemreefe protocol regression
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-js:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.1"
      - name: Validate synthetic movement contracts
        run: node --test fixtures/protocol-demo/index.test.mjs
  protocol-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: unpacker1/cemreefe-alfa2-protocol-lab
          ref: bfbecf5fb7f87f5ca723b7b048bdaf7430ad08cd
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Scan public lab for forbidden files
        run: python tools/public_guard.py .
      - name: Install clean-room protocol lab
        run: python -m pip install --disable-pip-version-check -e .
      - name: Alfa2 v12 and native GAME Python regression
        run: python -m unittest discover -s tests -v
      - name: Native GC packet sizes in isolated C++17
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic cpp/test_frame_contract.cpp -o "${RUNNER_TEMP}/protocol_contract"
          "${RUNNER_TEMP}/protocol_contract"
